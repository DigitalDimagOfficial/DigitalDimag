<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Dimag</title>
<style>
*{box-sizing:border-box} :root{--accent:#668cff;--panel:#172238;--line:#e4e8f0}
body{margin:0;font:14px Arial,sans-serif;color:#172238;height:100vh;overflow:hidden;background:linear-gradient(135deg,#101b40,#174e79,#167b91)}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}
.desktop{height:calc(100vh - 54px);padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.desk-icon{width:105px;padding:11px 8px;text-align:center;color:white;text-shadow:0 2px 4px #000;cursor:pointer;border-radius:12px;user-select:none}.desk-icon:hover{background:#ffffff25}.desk-icon span{display:block;font-size:35px;margin-bottom:7px}
.taskbar{position:absolute;bottom:0;width:100%;height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#111a2be8;color:white;backdrop-filter:blur(18px);border-top:1px solid #ffffff30}.taskbar button{background:transparent;color:white;font-size:21px;border-radius:8px;padding:7px 10px}.taskbar button:hover{background:#ffffff22}.task-clock{margin-left:auto;text-align:right;font-size:12px;line-height:1.45}
.start-menu{display:none;position:absolute;z-index:30;bottom:63px;left:12px;width:290px;padding:17px;background:#172238f5;color:white;border:1px solid #ffffff30;border-radius:16px;box-shadow:0 15px 50px #0008}.start-menu button{display:block;width:100%;text-align:left;background:#ffffff12;color:white;padding:12px;margin:5px 0;border-radius:8px}.start-menu button:hover{background:#ffffff28}
.window{display:none;position:absolute;z-index:10;top:3%;left:3%;width:94%;height:91%;background:#f6f8fc;border-radius:15px;overflow:hidden;box-shadow:0 20px 70px #0009}.win-head{height:43px;background:#e7ecf5;display:flex;align-items:center;padding:0 13px;font-weight:bold}.win-close{margin-left:auto;background:#e35d68;color:white;padding:7px 12px;border-radius:7px}.win-content{height:calc(100% - 43px);padding:18px;overflow:auto}
.btn{background:#2868c7;color:white;padding:9px 13px;border-radius:8px}.btn.secondary{background:#eaf0fa;color:#273750}.btn.danger{background:#c94b5b;color:white}.btn.small{padding:6px 9px;font-size:12px}.field{padding:11px;border:1px solid #ccd5e2;border-radius:9px;outline:none}.muted{color:#758198}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
#aiLayout{height:100%;margin:-18px;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0}.sidebar{background:#172238;color:white;padding:14px;display:flex;flex-direction:column;min-height:0}.brand{font-size:19px;font-weight:bold;padding:8px 4px 17px}.side-btn{width:100%;padding:11px;text-align:left;background:#ffffff13;color:white;border:1px solid #ffffff20;border-radius:9px;margin:3px 0}.side-btn:hover{background:#ffffff25}.side-search{width:100%;margin:9px 0;background:#ffffff12;color:white;border:1px solid #ffffff30}.side-search::placeholder{color:#bdc8d8}.side-label{font-size:10px;letter-spacing:1px;color:#aebbd0;margin:15px 4px 7px}.history{overflow:auto;flex:1;min-height:0}.history-item{display:flex;align-items:center;gap:4px;width:100%;padding:9px;background:transparent;color:#e6ebf4;text-align:left;border-radius:8px;margin:2px 0}.history-item:hover,.history-item.active{background:#ffffff20}.history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.side-footer{border-top:1px solid #ffffff25;padding-top:11px;color:#aebbd0;font-size:11px}
.ai-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#f8f9fc}.ai-top{height:52px;flex-shrink:0;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:bold}.ai-top small{font-weight:normal;color:#718098}.chatbox{flex:1;min-height:0;overflow:auto;padding:22px max(16px,8%)}.welcome{max-width:650px;margin:9vh auto 15px;text-align:center;color:#273750}.welcome h1{font-size:30px}.welcome p{color:#78849a}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:25px}.suggestions button{padding:13px;text-align:left;background:white;border:1px solid #e1e6ef;border-radius:11px;color:#34435b}.suggestions button:hover{background:#edf3ff}.msg{max-width:790px;margin:14px auto;padding:13px 16px;border-radius:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{width:fit-content;max-width:85%;margin-right:0;background:#e5edff}.msg.ai{background:white;border:1px solid #e5e9f0}.msg-label{font-size:10px;font-weight:bold;color:#5574b2;margin-bottom:6px}.msg-tools{display:flex;gap:6px;margin-top:8px}.msg-tools button{background:#edf2fa;color:#52617a;padding:5px 8px;border-radius:6px;font-size:11px}.sources{font-size:12px;margin-top:9px}.sources a{display:block;color:#2868c7;margin:4px 0}.composer-wrap{padding:10px 7% 15px;flex-shrink:0}.attach-name{font-size:12px;color:#596780;padding:0 5px 5px}.composer{display:flex;align-items:flex-end;gap:7px;padding:8px;background:white;border:1px solid #dce2ec;border-radius:15px;box-shadow:0 3px 14px #0000000a}.composer textarea{flex:1;min-width:0;max-height:130px;height:44px;resize:none;border:0;outline:0;padding:11px;background:transparent}.icon-btn{width:40px;height:40px;border-radius:10px;background:#edf2fa;color:#34435b;font-size:17px}.send-btn{background:#2868c7;color:white}.composer-note{text-align:center;color:#8a94a5;font-size:10px;margin-top:8px}.toggle-search{font-size:11px;color:#61708a;display:flex;align-items:center;gap:5px;margin-top:6px}.toggle-search input{accent-color:#2868c7}
#fileInput{display:none}.attachment-preview{font-size:12px;color:#5c6a80;padding:4px 3px}.source-list a{display:block;margin:5px 0}.modal-back{display:none;position:absolute;z-index:40;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal{width:min(520px,100%);max-height:85%;overflow:auto;background:white;color:#20304a;padding:20px;border-radius:14px;box-shadow:0 15px 60px #0008}.modal textarea{width:100%;min-height:110px}.modal h3{margin-top:0}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.directory-frame{display:block;width:calc(100% + 36px);height:calc(100% + 36px);margin:-18px;border:0;background:white}
@media(max-width:700px){.window{top:1%;left:1%;width:98%;height:97%}#aiLayout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sidebar{max-height:180px}.history{display:flex;max-height:54px}.history-item{width:150px;flex-shrink:0}.side-footer{display:none}.suggestions{grid-template-columns:1fr}.task-label{display:none}}
</style>
</head>
<body>
<div class="desktop">
 <div class="desk-icon" onclick="openApp('files')"><span>📁</span>File Manager</div>
 <div class="desk-icon" onclick="openApp('browser')"><span>🌐</span>Browser</div>
 <div class="desk-icon" onclick="openApp('notes')"><span>📝</span>Notes</div>
 <div class="desk-icon" onclick="openApp('terminal')"><span>💻</span>Terminal</div>
 <div class="desk-icon" onclick="openApp('settings')"><span>⚙️</span>Settings</div>
 <div class="desk-icon" onclick="openApp('ai')"><span>🤖</span>Digital AI</div>
 <div class="desk-icon" onclick="openApp('directory')"><span>🌐</span>Website Directory</div>
</div>
<div class="start-menu" id="startMenu"><h3>🧠 Digital Dimag</h3><button onclick="openApp('ai')">🤖 Digital AI</button><button onclick="openApp('files')">📁 File Manager</button><button onclick="openApp('browser')">🌐 Browser</button><button onclick="openApp('notes')">📝 Notes</button><button onclick="openApp('settings')">⚙️ Settings</button><button onclick="openApp('directory')">🌐 Website Directory</button></div>
<div class="taskbar"><button onclick="toggleStart()">⊞</button><button onclick="openApp('ai')">🤖</button><b class="task-label">Digital Dimag</b><div class="task-clock" id="clock"></div></div>
<div class="window" id="win"><div class="win-head"><span id="heading">App</span><button class="win-close" onclick="closeApp()">✕</button></div><div class="win-content" id="content"></div></div>
<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const $=id=>document.getElementById(id);
const CHAT_KEY='digitalDimag_chats_v2', OLD_KEY='digitalAI_chat_history_v1', MEMORY_KEY='digitalDimag_memory_v1';
let chats=[],messages=[],chatId=makeId(),busy=false,attachment=null,webSearch=false;
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function safeLoad(){try{const x=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');if(Array.isArray(x))chats=x}catch(e){chats=[]}if(!chats.length){try{const old=JSON.parse(localStorage.getItem(OLD_KEY)||'[]');if(Array.isArray(old)&&old.length){chats=[{id:chatId,title:'Previous Conversation',updatedAt:Date.now(),messages:old}];saveChats()}}catch(e){}}}
function saveChats(){try{localStorage.setItem(CHAT_KEY,JSON.stringify(chats))}catch(e){alert('Browser storage is full. Export chats and remove old conversations.')}}
function saveCurrent(){if(!messages.length)return;const first=messages.find(m=>m.role==='user');const obj={id:chatId,title:first?first.text.slice(0,42):'New chat',updatedAt:Date.now(),messages};const i=chats.findIndex(c=>c.id===chatId);if(i>=0)chats[i]=obj;else chats.unshift(obj);saveChats();renderHistory()}
function toggleStart(){const m=$('startMenu');m.style.display=m.style.display==='block'?'none':'block'}
function openApp(app){
 $('startMenu').style.display='none';$('win').style.display='block';
 const apps={
 files:['📁 File Manager',`<h2>My Files</h2><div class="card">Project files are stored in your GitHub Codespace.</div><div class="card">📄 index.html</div><div class="card">⚙️ server.mjs</div><div class="card">📦 package.json</div>`],
 browser:['🌐 Browser',`<h2>Quick links</h2><button class="btn" onclick="window.open('https://www.google.com','_blank')">Google</button><button class="btn" onclick="window.open('https://www.youtube.com','_blank')">YouTube</button><button class="btn" onclick="window.open('https://aistudio.google.com','_blank')">Google AI Studio</button>`],
 notes:['📝 Notes',`<h2>My Notes</h2><textarea id="note" style="width:100%;height:65vh" placeholder="Write notes..."></textarea><br><button class="btn" onclick="saveNotes()">Save notes</button><span id="noteStatus"></span>`],
 terminal:['💻 Terminal',`<h2>Codespaces Terminal</h2><p>Your real Linux terminal is in the Codespaces panel.</p><code>node server.mjs</code>`],
 settings:['⚙️ Settings',`<h2>Settings</h2><div class="card"><b>Wallpaper</b><br><button class="btn" onclick="wall('ocean')">Ocean</button><button class="btn" onclick="wall('sunset')">Sunset</button><button class="btn" onclick="wall('forest')">Forest</button></div><div class="card"><b>Personal memory</b><p>Add facts you want Digital AI to use in future chats. Avoid passwords or sensitive details.</p><button class="btn" onclick="memoryModal()">Manage memory</button></div><div class="card"><b>Chat backup</b><br><button class="btn" onclick="exportChats()">Export chats</button><button class="btn secondary" onclick="$('importInput').click()">Import chats</button><input id="importInput" type="file" accept="application/json" style="display:none" onchange="importChats(event)"></div><div class="card"><b>AI model</b><p class="muted">Configured on the server using GEMINI_MODEL. API key stays on the server.</p><button class="btn secondary" onclick="checkStatus()">Check AI connection</button><span id="statusText"></span></div>`],
 ai:['🤖 Digital AI',`<div id="aiLayout"><aside class="sidebar"><div class="brand">🧠 Digital Dimag</div><button class="side-btn" onclick="newChat()">＋ New Chat</button><button class="side-btn" onclick="memoryModal()">🧠 Manage Memory</button><button class="side-btn" onclick="exportChats()">⬇ Export chats</button><input id="historySearch" class="field side-search" placeholder="🔎 Search chats" oninput="renderHistory()"><div class="side-label">CHAT HISTORY</div><div class="history" id="historyList"></div><div class="side-footer">Personal AI workspace<br>Powered by Gemini API</div></aside><main class="ai-main"><div class="ai-top"><span>Digital AI <small id="modelStatus">· Personal assistant</small></span><button class="btn secondary" onclick="openApp('settings')">⚙ Settings</button></div><div class="chatbox" id="chatBox"></div><div class="composer-wrap"><div class="attachment-preview" id="attachmentPreview"></div><div class="composer"><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,.txt,.md,.csv" onchange="pickFile(event)"><button class="icon-btn" title="Attach file" onclick="$('fileInput').click()">＋</button><button class="icon-btn" title="Voice input" onclick="voiceInput()">🎤</button><textarea id="chatInput" placeholder="Message Digital Dimag..." rows="1"></textarea><button class="send-btn icon-btn" id="sendBtn" onclick="sendChat()">➤</button></div><label class="toggle-search"><input type="checkbox" id="webToggle"> Try Google Search grounding (availability depends on model/account)</label><div class="composer-note">AI can make mistakes. Check important information. Attachments are sent to your Gemini API for analysis.</div></div></main></div>`],
 directory:['🌐 Website Directory',`<iframe class="directory-frame" src="/website-directory.html" title="Digital Dimag Website Directory"></iframe>`]
 };
 if(!apps[app]){closeApp();return}
 $('heading').textContent=apps[app][0];$('content').innerHTML=apps[app][1];
 if(app==='notes')$('note').value=localStorage.getItem('digitalnotes')||'';
 if(app==='ai'){renderChat();renderHistory();$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});$('chatInput').addEventListener('input',e=>{e.target.style.height='44px';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'})}
}
function closeApp(){$('win').style.display='none'}
function saveNotes(){localStorage.setItem('digitalnotes',$('note').value);$('noteStatus').textContent=' ✓ Saved'}
function wall(name){const w={ocean:'linear-gradient(135deg,#101b40,#174e79,#167b91)',sunset:'linear-gradient(135deg,#421b57,#a14b77,#e18b73)',forest:'linear-gradient(135deg,#123c29,#25805c,#a1b96c)'};document.body.style.background=w[name];localStorage.setItem('digitalDimag_wallpaper',name)}
function renderHistory(){const el=$('historyList');if(!el)return;el.innerHTML='';const q=($('historySearch')?.value||'').toLowerCase();[...chats].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).filter(c=>(c.title||'').toLowerCase().includes(q)).forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===chatId?' active':'');const t=document.createElement('span');t.className='history-title';t.textContent=c.title||'Untitled chat';b.appendChild(t);const menu=document.createElement('span');menu.textContent='⋯';menu.title='Chat options';menu.onclick=e=>{e.stopPropagation();chatMenu(c.id)};b.appendChild(menu);b.onclick=()=>openChat(c.id);el.appendChild(b)});if(!el.children.length){const d=document.createElement('div');d.textContent='No chats yet';d.style.color='#aebbd0';d.style.padding='10px';el.appendChild(d)}}
function chatMenu(id){const c=chats.find(x=>x.id===id);if(!c)return;const action=prompt('Type: rename or delete','rename');if(action==='rename'){const n=prompt('New chat title',c.title);if(n?.trim()){c.title=n.trim().slice(0,80);saveChats();renderHistory()}}else if(action==='delete'&&confirm('Delete this conversation?')){chats=chats.filter(x=>x.id!==id);if(chatId===id){messages=[];chatId=makeId();renderChat()}saveChats();renderHistory()}}
function openChat(id){if(busy)return;saveCurrent();const c=chats.find(x=>x.id===id);if(!c)return;chatId=c.id;messages=Array.isArray(c.messages)?c.messages.map(x=>({...x})):[];renderChat();renderHistory()}
function newChat(){if(busy)return;saveCurrent();chatId=makeId();messages=[];attachment=null;renderChat();renderHistory();$('attachmentPreview').textContent='';$('chatInput')?.focus()}
function renderChat(){const box=$('chatBox');if(!box)return;box.innerHTML='';if(!messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<h1>Hello! 👋</h1><p>What can I help you with today?</p><div class="suggestions"><button>💡 Give me creative ideas</button><button>💻 Help me write code</button><button>📚 Teach me something new</button><button>🚀 Help plan my project</button></div>';w.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('chatInput').value=b.textContent.replace(/^\S+\s/,'');sendChat()});box.appendChild(w)}else messages.forEach(m=>addMessage(m.role,m.text,m.sources||[]));box.scrollTop=box.scrollHeight}
function addMessage(role,text,sources=[]){const box=$('chatBox');if(!box)return null;const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'ai');if(role!=='user'){const label=document.createElement('div');label.className='msg-label';label.textContent='🧠 DIGITAL DIMAG';el.appendChild(label)}const body=document.createElement('div');body.textContent=text;el.appendChild(body);if(sources.length){const s=document.createElement('div');s.className='sources';sources.forEach(src=>{const a=document.createElement('a');a.href=src.url;a.target='_blank';a.rel='noopener';a.textContent='↗ '+src.title;s.appendChild(a)});el.appendChild(s)}if(role!=='user'){const tools=document.createElement('div');tools.className='msg-tools';const copy=document.createElement('button');copy.textContent='Copy';copy.onclick=()=>navigator.clipboard?.writeText(text);const speak=document.createElement('button');speak.textContent='🔊 Read aloud';speak.onclick=()=>speakText(text);tools.append(copy,speak);el.appendChild(tools)}box.appendChild(el);box.scrollTop=box.scrollHeight;return body}
async function pickFile(e){const f=e.target.files?.[0];if(!f)return;if(f.size>13*1024*1024){alert('Please choose a file smaller than 13 MB.');e.target.value='';return}try{if(f.type==='text/plain'||f.name.endsWith('.md')||f.name.endsWith('.csv')){const text=await f.text();attachment={name:f.name,text};$('attachmentPreview').textContent='📎 '+f.name+' (text attached)'}else if(['image/png','image/jpeg','image/webp','application/pdf'].includes(f.type)){const data=(await fileToDataURL(f)).split(',')[1];attachment={name:f.name,mimeType:f.type,data};$('attachmentPreview').textContent='📎 '+f.name}else{alert('Supported: images, PDF, TXT, MD and CSV.');return}}catch(err){alert('Could not read this file.')}e.target.value=''}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function getMemory(){return localStorage.getItem(MEMORY_KEY)||''}
function memoryModal(){showModal(`<h3>🧠 Digital Dimag Memory</h3><p class="muted">Add details you want the AI to use in future chats. Keep it non-sensitive. Stored only in this browser.</p><textarea id="memoryText" class="field" style="width:100%" placeholder="Example: I am building Digital Dimag and prefer step-by-step Hinglish guidance."></textarea><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="saveMemory()">Save memory</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);$('memoryText').value=getMemory()}
function saveMemory(){localStorage.setItem(MEMORY_KEY,$('memoryText').value.slice(0,5000));closeModal();alert('Memory saved in this browser.')}
function showModal(html){$('modal').innerHTML=html;$('modalBack').style.display='flex'}
function closeModal(){$('modalBack').style.display='none'}
async function sendChat(){if(busy)return;const input=$('chatInput'),text=input.value.trim();if(!text&&!attachment)return;const prior=messages.slice(-16).map(m=>({role:m.role,text:m.text}));const userText=text+(attachment?(text?'\n':'')+'[Attached: '+attachment.name+']':'');messages.push({role:'user',text:userText});const welcome=$('chatBox').querySelector('.welcome');if(welcome)welcome.remove();addMessage('user',userText);saveCurrent();input.value='';input.style.height='44px';busy=true;$('sendBtn').disabled=true;const loading=addMessage('model','Digital Dimag is thinking...');const outgoing=attachment?{...attachment}:null;attachment=null;$('attachmentPreview').textContent='';try{let payload={message:text||'Please analyze the attached file.',history:prior,memory:getMemory(),webSearch:$('webToggle')?.checked||false};if(outgoing?.text)payload.message+='\n\nFile content ('+outgoing.name+'):\n'+outgoing.text.slice(0,30000);else if(outgoing?.data)payload.attachment={mimeType:outgoing.mimeType,data:outgoing.data};const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch(e){throw new Error('Server returned an invalid response. Check Codespaces Terminal.')}if(!r.ok)throw new Error(data.error||'AI request failed');const reply=data.reply||'No response received.';loading.textContent=reply;messages.push({role:'model',text:reply,sources:data.sources||[]});const parent=loading.parentElement;if(parent&&data.sources?.length){const s=document.createElement('div');s.className='sources';data.sources.forEach(src=>{const a=document.createElement('a');a.href=src.url;a.target='_blank';a.rel='noopener';a.textContent='↗ '+src.title;s.appendChild(a)});parent.appendChild(s)}saveCurrent()}catch(err){loading.textContent='Error: '+err.message;saveCurrent()}finally{busy=false;$('sendBtn').disabled=false;$('chatBox').scrollTop=$('chatBox').scrollHeight}}
function voiceInput(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice recognition is not supported in this browser. Try Chrome.');return}const r=new SR();r.lang='hi-IN';r.interimResults=false;r.onresult=e=>{$('chatInput').value+=($('chatInput').value?' ':'')+e.results[0][0].transcript;$('chatInput').focus()};r.onerror=()=>alert('Microphone error. Check browser permission.');r.start()}
function speakText(text){if(!('speechSynthesis'in window)){alert('Text-to-speech is not supported here.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';speechSynthesis.speak(u)}
function exportChats(){saveCurrent();const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),chats},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='digital-dimag-chats.json';a.click();URL.revokeObjectURL(a.href)}
async function importChats(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.chats))throw new Error('Invalid backup file');const known=new Set(chats.map(c=>c.id));data.chats.forEach(c=>{if(c&&Array.isArray(c.messages)&&!known.has(c.id))chats.push(c)});saveChats();renderHistory();alert('Chat backup imported.')}catch(err){alert('Could not import this backup: '+err.message)}e.target.value=''}
async function checkStatus(){try{const r=await fetch('/api/status');const d=await r.json();$('statusText').textContent=d.configured?' ✓ Connected · '+d.model:' ✕ API key missing';}catch(e){$('statusText').textContent=' Server not reachable'}}
function tick(){$('clock').innerHTML=new Date().toLocaleTimeString()+'<br>'+new Date().toLocaleDateString()}
tick();setInterval(tick,1000);safeLoad();const savedWall=localStorage.getItem('digitalDimag_wallpaper');if(savedWall)wall(savedWall);
</script>
</body>
</html>

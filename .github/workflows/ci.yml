name: Digital Dimag Automatic Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.mjs

      - name: Check important project files
        run: |
          test -f index.html
          test -f digitaldimag.html
          test -f website-directory.html
          echo "All important files are present."
